name: Build Windows
run-name: Windows x64 · ${{ github.ref_name }}

on:
  push:
    branches: [feature/happ-subscription]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.4.3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Test Happ subscription conversion
        run: flutter test test/xray_test.dart

      - name: Download pinned Go modules
        working-directory: core
        run: go mod download

      - name: Build core, helper, app and installer
        run: dart setup.dart windows --arch amd64 --env stable

      - name: Verify packages and record checksums
        shell: pwsh
        run: |
          $files = @(
            'FlClashX-windows-amd64-setup.exe',
            'FlClashX-windows-amd64.zip'
          )
          foreach ($name in $files) {
            $file = Join-Path dist $name
            if (!(Test-Path $file)) { throw "Missing package: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$file.sha256" -Encoding ascii
          }
          "Source commit: $env:GITHUB_SHA" | Set-Content dist/BUILD.txt
          "Architecture: Windows x64 (amd64)" | Add-Content dist/BUILD.txt
          "Unsigned personal fork with Happ support" | Add-Content dist/BUILD.txt

      - uses: actions/upload-artifact@v6
        with:
          name: FlClashX-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
